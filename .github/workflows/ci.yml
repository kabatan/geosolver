name: GeoSolver CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        id: dependencies
        run: uv sync --all-extras --frozen
      - name: Test solver, benchmarks and GMB
        run: uv run python -m pytest --import-mode=importlib
      - name: Lint solver and benchmarks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run ruff check src tests benchmarks .github/scripts
      - name: Compile source
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python -m compileall -q src tests
      - name: Verify generated schemas
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run python -m geosolver.schemas.generate --check
      - name: Build clean wheel
        id: wheel
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv build
      - name: Verify installed wheel without repository imports
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: uv run python .github/scripts/verify_wheel.py
