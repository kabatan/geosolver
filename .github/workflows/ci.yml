name: GeoSolver CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --all-extras --frozen
      - name: Verify Python and worker behavior
        run: uv run pytest
      - name: Lint research core
        run: uv run ruff check src tests benchmarks .github/scripts
      - name: Compile source
        run: uv run python -m compileall -q src tests
      - name: Verify generated schemas
        run: uv run python -m geosolver.schemas.generate --check
      - name: Build clean wheel
        run: uv build
      - name: Verify installed wheel without repository imports
        run: uv run python .github/scripts/verify_wheel.py
