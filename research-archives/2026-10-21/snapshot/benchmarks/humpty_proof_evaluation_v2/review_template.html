<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>証明への転移 — 評価候補 v2</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f5f3,#141a17);--panel:light-dark(#fff,#202923);--ink:light-dark(#24372c,#e7eee9);--muted:light-dark(#596c60,#a8b9ad);--line:light-dark(#d8e0da,#3c4c41);--accent:light-dark(#276144,#a2d3b4);--select:light-dark(#e8f1eb,#304839)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 system-ui,sans-serif}a{color:var(--accent)}header{background:var(--panel);padding:24px 30px;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}h2{font-size:23px;line-height:1.5}h3{font-size:16px;margin-top:24px}.muted{font-size:13px;color:var(--muted)}.top,.toolbar,.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.counts{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}.counts b{font-size:21px;margin-right:5px}button,input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover{background:var(--select)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1450px;margin:auto}aside{position:sticky;top:0;max-height:100vh;overflow:auto;padding:20px 14px;border-right:1px solid var(--line)}.filters{display:grid;gap:10px}.filters label,.review label{display:grid;font-size:13px;gap:4px}.filters select,.filters input{width:100%}#list{display:grid;gap:6px;margin-top:15px}.item{width:100%;text-align:left;background:transparent;border-color:transparent;padding:12px}.item.active{background:var(--select);border-color:var(--accent)}.item strong{display:block;font-size:14px}.item span{font-size:12px;color:var(--muted)}main{padding:24px 34px 70px;min-width:0}.tag{font-size:12px;background:var(--select);padding:3px 8px;border-radius:4px}.problem{background:var(--panel);padding:22px;font-size:17px;border-left:3px solid var(--accent);white-space:pre-wrap}.section{border-top:1px solid var(--line);margin-top:24px;padding-top:3px}details{border-top:1px solid var(--line);padding-top:15px;margin-top:20px}summary{cursor:pointer;font-weight:600}li{margin:8px 0}ol,ul{padding-left:23px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);padding:15px;font-size:12px}.notice{border-left:3px solid var(--line);padding:0 12px;color:var(--muted);font-size:13px}.review{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-top:30px}.review h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.review textarea{width:100%;min-height:100px;resize:vertical}.source{overflow-wrap:anywhere}#status{min-height:1.5em}.diagram{max-width:640px;width:100%;margin:10px auto;display:block}svg text{paint-order:stroke;stroke:var(--panel);stroke-width:4;stroke-linejoin:round;fill:var(--ink);font:14px system-ui}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static;border-right:0;border-bottom:1px solid var(--line);max-height:none}#list{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));max-height:240px;overflow:auto}main,header{padding:20px}.filters{grid-template-columns:1fr 1fr}.problem{padding:16px}}@media(max-width:460px){.grid,.filters{grid-template-columns:1fr}}@media print{aside,.toolbar,.review,.nav button{display:none}.layout{display:block}main,header{padding:0}details{display:block}}
</style>
<header><div class="top"><div><h1>補助点を見つければ、証明が終わる</h1><div class="muted">Humpty・Dumpty周辺 · 評価候補 v2 · 追加の難所を減らした改訂</div></div><div class="toolbar"><button id="export">レビューをJSONで保存</button><label class="muted">読み込み <input id="import" type="file" accept="application/json" style="max-width:185px"></label></div></div><div id="counts" class="counts"></div><div class="muted"><a href="README.md">評価方針</a> · <a href="catalogue.md">問題と完全解答</a> · <a href="transfer_main_prompts.jsonl">別配置の問題のみ</a> · <a href="researcher_problems.json">研究者用JSON</a> · <a href="manifest.json">学習集合との分離</a></div><p class="notice">補助点の導入・同定を主な着想にし、その後は短く終わる問題を集めました。AoPSの原題はDA15と同じ配置なので、数値から同配置の証明への転移として表示します。点の名称だけで核心を省略せず、正しい座標証明も満点。学習前後の測定は未実施です。</p><div id="status" class="muted" role="status"></div></header>
<div class="layout"><aside><div class="filters"><label>評価の役割<select id="role"><option value="all">すべて</option></select></label><label>検索<input id="search" type="search" placeholder="ID・題材・性質"></label></div><div id="list"></div></aside><main id="detail"></main></div>
<script>
'use strict';
const DATA=/*DATASET*/null;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x:x?[x]:[],lis=(x,ordered=false)=>`<${ordered?'ol':'ul'}>${arr(x).map(t=>'<li>'+esc(t)+'</li>').join('')}</${ordered?'ol':'ul'}>`;
const key='humpty-proof-review-v2:'+DATA.manifest.dataset_sha256;
let reviews={},selected=DATA.cards.find(c=>c.role==='transfer_main')?.id,visible=[];
try{reviews=JSON.parse(localStorage.getItem(key)||'{}').reviews||{}}catch(e){$('status').textContent='保存済みレビューを読み込めませんでした。'}
for(const [v,l] of Object.entries(DATA.roles))$('role').insertAdjacentHTML('beforeend',`<option value="${v}">${esc(l)}</option>`);
function count(){$('counts').innerHTML=Object.entries(DATA.roles).map(([k,v])=>`<span><b>${DATA.manifest.stats.roles[k]||0}</b>${esc(v)}</span>`).join('')}
function filter(){const q=$('search').value.trim().toLowerCase();visible=DATA.cards.filter(c=>($('role').value==='all'||c.role===$('role').value)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));if(!visible.some(c=>c.id===selected))selected=visible[0]?.id;renderList();detail()}
function renderList(){$('list').innerHTML=visible.map(c=>`<button class="item ${c.id===selected?'active':''}" data-id="${esc(c.id)}" aria-current="${c.id===selected}"><span>${esc(c.id)} · ${esc(DATA.roles[c.role])}</span><strong>${esc(c.title_ja)}</strong>${reviews[c.id]?.decision?'<span>評価済み</span>':''}</button>`).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderList();detail()})}
const opts=(values,current)=>[['','未評価'],...values].map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${esc(l)}</option>`).join('');
function detail(){const c=DATA.cards.find(c=>c.id===selected);if(!c){$('detail').innerHTML='<p>該当する問題はありません。</p>';return}const r=reviews[c.id]||{},i=visible.findIndex(x=>x.id===c.id);$('detail').innerHTML=`
<div class="nav"><div><span class="tag">${esc(c.id)}</span> <span class="tag">${esc(DATA.roles[c.role])}</span></div><div><button id="prev" ${i===0?'disabled':''}>前へ</button> <button id="next" ${i===visible.length-1?'disabled':''}>次へ</button></div></div>
<h2>${esc(c.title_ja)}</h2><div class="problem">${esc(c.problem_ja)}</div>
${c.diagram_svg||''}
<h3>何を測るか</h3><p>${esc(c.transfer_target_ja)}</p><p class="notice">${esc(c.overlap_level_ja)}</p><details><summary>補助点を導入すると、どれだけ短くなるか</summary>${lis(c.short_route_ja,true)}<p><strong>その後に残る処理：</strong>${esc(c.after_discovery_ja)}</p></details>
<details><summary>核心の根拠と完全解答</summary><p><strong>核心の根拠：</strong>${esc(c.key_lemma_ja)}</p>${lis(c.solution_ja,true)}<p><strong>補助構成：</strong>${esc(c.key_auxiliary_ja)}</p>${(c.alternative_solutions_ja||[]).map(a=>'<h3>別解：'+esc(a.code)+'</h3>'+lis(a.steps,true)).join('')}</details>
<details><summary>学習との重なり・評価としての限界</summary>${lis(c.overlap_audit_ja)}<p><strong>関連する主学習ID：</strong>${esc((c.training_overlap_ids||[]).join(', '))}</p><p><strong>共通する証明の核：</strong>${esc(c.family_id)}</p><p>${esc(c.novelty_status)}</p></details>
<details><summary>採点基準</summary><p>完全な証明の正誤を主指標にします。特殊点の名称だけで核心を済ませたものは完答にしません。参照配点は別解にも同等に適用します。</p>${lis(c.scoring_ja)}</details>
<details><summary>条件・数学的な検証・出典</summary>${lis(c.domain_ja)}${lis(c.verification_ja)}${c.witness?'<pre>'+esc(JSON.stringify(c.witness,null,2))+'</pre>':''}<div class="source">${(c.source||[]).map(s=>'<p>'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>':esc(s.title))+' — '+esc(s.locator)+'</p>').join('')}</div></details>
<div class="review"><h3>評価問題としてのレビュー</h3><div class="grid"><label>採否<select id="decision">${opts([['accept','採用'],['revise','修正して採用'],['support','補助評価へ'],['reject','不採用']],r.decision)}</select></label><label>狙う能力を測れるか<select id="transfer">${opts([['clear','適切'],['near','学習との重複の扱いを要検討'],['other','導入後に別の難所が残る'],['unclear','判断保留']],r.transfer)}</select></label><label>数学的な妥当性<select id="correctness">${opts([['ok','問題・証明とも妥当'],['fix','修正が必要'],['uncertain','追加確認が必要']],r.correctness)}</select></label><label>難度<select id="difficulty">${opts([['easy','易しすぎる'],['suitable','適切'],['hard','主評価には難しすぎる']],r.difficulty)}</select></label><label class="wide">コメント<textarea id="comment" placeholder="別解、学習との近さ、より自然な定式化など">${esc(r.comment)}</textarea></label></div><div id="saved" class="muted" role="status">変更はこのブラウザに保存します。共有にはJSON保存を使ってください。</div></div>`;
$('prev').onclick=()=>{selected=visible[i-1].id;renderList();detail()};$('next').onclick=()=>{selected=visible[i+1].id;renderList();detail()};for(const k of ['decision','transfer','correctness','difficulty','comment'])$(k).addEventListener(k==='comment'?'input':'change',()=>{reviews[c.id]={...reviews[c.id],id:c.id,[k]:$(k).value,updated_at:new Date().toISOString()};persist();renderList()});}
function persist(){try{localStorage.setItem(key,JSON.stringify({dataset_sha256:DATA.manifest.dataset_sha256,reviews}));if($('saved'))$('saved').textContent='ブラウザに保存しました。共有にはJSONで保存してください。'}catch(e){$('status').textContent='ブラウザ保存に失敗しました。JSONで保存してください。'}}
$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({version:'proof-v2',dataset_sha256:DATA.manifest.dataset_sha256,reviews:Object.values(reviews)},null,2)],{type:'application/json'}));a.href=url;a.download='humpty-proof-evaluation-v2-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('import').onchange=async()=>{const file=$('import').files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!=='proof-v2'||d.dataset_sha256!==DATA.manifest.dataset_sha256||!Array.isArray(d.reviews))throw Error('この評価問題の版に対応するJSONを指定してください。');for(const r of d.reviews)if(DATA.cards.some(c=>c.id===r.id))reviews[r.id]=r;persist();filter();$('status').textContent='レビューを読み込みました。'}catch(e){$('status').textContent='読み込めませんでした：'+e.message}};
$('role').onchange=filter;$('search').oninput=filter;count();filter();
</script></html>
