<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Humpty周辺 v2 — 幾何的な着想と残る計算</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f5f5f2,#151817);--panel:light-dark(#fff,#202422);--ink:light-dark(#1c2923,#e4ece7);--muted:light-dark(#5b6b62,#a6b5ad);--line:light-dark(#d8e0da,#3b4840);--accent:light-dark(#1b6344,#93d7ad);--selected:light-dark(#e9f3eb,#2b4434)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 10px}button{cursor:pointer}button:hover{background:var(--selected)}button:disabled{opacity:.4;cursor:default}a{color:var(--accent)}h1{font-size:22px;line-height:1.4;margin:0 0 8px}h2{font-size:22px;margin:10px 0 15px}h3{font-size:16px;margin:24px 0 8px}p{margin:10px 0}header{padding:25px 30px 18px;border-bottom:1px solid var(--line);background:var(--panel)}header .top{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.counts{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}.counts strong{font-size:19px;margin-right:5px}.layout{align-items:start;display:grid;grid-template-columns:330px minmax(0,1fr);max-width:1500px;margin:auto;min-height:80vh}aside{position:sticky;top:0;max-height:100vh;overflow:auto;border-right:1px solid var(--line);padding:20px 15px}.filters{display:grid;gap:10px;margin-bottom:16px}.filters label{display:grid;gap:3px;font-size:13px}.filters input,.filters select{width:100%}#list{display:grid;gap:5px}.item{text-align:left;width:100%;padding:11px 12px;white-space:normal;border-color:transparent;background:transparent}.item.active{background:var(--selected);border-color:var(--accent)}.item .id{font-size:12px;color:var(--muted)}.item .name{display:block;line-height:1.5}.item .state{font-size:12px;color:var(--accent)}main{padding:25px 36px 70px;min-width:0}.navrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:12px;padding:2px 8px;background:var(--selected);border-radius:3px}.source{font-size:13px;overflow-wrap:anywhere}.lead{padding:18px 22px;background:var(--panel);border-left:3px solid var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}.section{border-top:1px solid var(--line);margin-top:23px;padding-top:4px}ol,ul{padding-left:24px}li{margin:5px 0}.query{padding:12px 0;border-bottom:1px solid var(--line)}.query strong{font-size:17px}.review{background:var(--panel);padding:20px;margin-top:30px;border:1px solid var(--line);border-radius:6px}.review h3{margin-top:0}.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reviewgrid label{display:grid;gap:4px}.reviewgrid .wide{grid-column:1/-1}.review textarea{min-height:100px;resize:vertical;width:100%}.review input,.review select{width:100%}details{margin:17px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:var(--panel);padding:15px;border:1px solid var(--line)}.empty{padding:30px 0;color:var(--muted)}.notice{font-size:13px;border-left:3px solid var(--line);padding-left:12px;margin:15px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}#save-status{font-size:12px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}#list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:290px;overflow:auto}main{padding:22px 18px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}header{padding:22px 18px}}@media(max-width:450px){.reviewgrid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.counts{gap:10px}.lead{padding:13px}}@media print{aside,.toolbar,.navrow button,.review{display:none}.layout{display:block}main{padding:0}header{padding:0}details{display:block}body{background:white;color:black}}

.solution{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.arithmetic{background:var(--selected);padding:12px 18px}.arithmetic h3{margin-top:0}.equation{font:17px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}.warning{border-left:3px solid #b88b3d;padding-left:12px}#global-status{min-height:1.5em}.lead{font-size:16px}@media(max-width:1000px){.solution{grid-template-columns:1fr}}</style>
<header><div class="top"><div><h1>幾何的な着想と、残る計算</h1><div class="muted">Humpty周辺の求値問題 v2 · 与条件・問いを設計し直した研究者レビュー用データ</div></div><div class="toolbar"><button id="export">評価をJSONで保存</button><label><span class="muted">v2の評価を読み込む </span><input type="file" id="import" accept="application/json" style="max-width:200px"></label></div></div>
<div class="counts" id="counts"></div>
<div class="muted"><a href="README.md">方針・検証範囲</a> · <a href="catalogue.md">全件の台帳</a> · <a href="training_problems.jsonl" download>主学習候補の問題と答え</a> · <a href="probe_problems.jsonl" download>性質の確認用</a> · <a href="revisions.json" download>研究者用JSON</a> · <a href="review.csv" download>評価用CSV</a></div>
<p class="muted">各問の幾何的性質と、その後に必要な計算を並べています。解法・検証用の座標は学習入力に含めません。ここにあるのは改訂した具体例で、solverによる量産・学習実験はまだ行っていません。前版のデータと評価は別に保存されています。</p><div class="muted" id="global-status" role="status"></div></header>
<div class="layout"><aside><div class="filters"><label class="search">検索<input id="search" type="search" placeholder="ID・配置・幾何的性質"></label><label>改訂判断<select id="split"><option value="all">すべて</option><option value="main">主学習候補</option><option value="probe">性質の確認用</option><option value="defer">再設計待ち</option><option value="holdout">評価留保</option><option value="exclude">不採用</option></select></label><label>確認状況<select id="reviewed"><option value="all">すべて</option><option value="pending">未評価</option><option value="done">評価済み</option></select></label></div><div id="filtered-count" class="muted" aria-live="polite"></div><div id="list"></div></aside><main id="detail"></main></div>
<script>
'use strict';
const DATA=/*DATASET*/null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={main:'主学習候補',probe:'性質の確認用',defer:'再設計待ち',holdout:'評価留保',exclude:'不採用'};
const proofNames={proved_here:'この作業で関係を検証',source_proof_checked:'出典の証明を確認',source_claim_only:'出典の命題を使用・一般証明の再確認は未了',unverified:'未確認'};
const key='humpty-config-review-v2:'+DATA.sha256;
let reviews={},selected=DATA.cards.find(c=>c.decision==='main')?.id||DATA.cards[0]?.id,visible=[];
try{const stored=JSON.parse(localStorage.getItem(key)||'{}');if(stored.dataset_sha256===DATA.sha256)reviews=stored.reviews||{};else if(stored.dataset_sha256)$('global-status').textContent='問題データが更新されています。旧v2の評価は保存されていますが自動適用しません。評価をJSONで読み込む際に確認してください。'}catch(e){$('global-status').textContent='保存済み評価を読み出せませんでした。'}
const reviewed=r=>!!(r&&(r.decision||r.arithmetic||r.benefit||r.correctness||r.comment));
const listHTML=(xs,ordered=false)=>{const tag=ordered?'ol':'ul';return '<'+tag+'>'+(xs||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</'+tag+'>'};
const opts=(xs,value)=>xs.map(([v,l])=>`<option value="${v}" ${v===String(value??'')?'selected':''}>${esc(l)}</option>`).join('');
function persist(){try{localStorage.setItem(key,JSON.stringify({dataset_sha256:DATA.sha256,reviews}));if($('save-status'))$('save-status').textContent='ブラウザに保存しました。共有にはJSONを保存してください。'}catch(e){if($('save-status'))$('save-status').textContent='ブラウザ保存が使えません。JSONで保存してください。'}}
function counts(){const d=DATA.stats.decisions;$('counts').innerHTML=`<span><strong>${d.main||0}</strong>主学習候補</span><span><strong>${DATA.stats.main_legacy_structural_groups}</strong>前版での構造群</span><span><strong>${d.probe||0}</strong>性質の確認用</span><span><strong>${d.defer||0}</strong>再設計待ち</span><span><strong>${DATA.stats.total}</strong>${DATA.stats.missing_ids.length?'再点検済み':'全件再点検'}</span><span><strong>${Object.values(reviews).filter(reviewed).length}</strong>評価済み</span>`}
function filter(){const q=$('search').value.trim().toLowerCase(),s=$('split').value,r=$('reviewed').value;visible=DATA.cards.filter(c=>(s==='all'||c.decision===s)&&(r==='all'||(r==='done')===reviewed(reviews[c.id]))&&(!q||(/^(ev|hx|h|da|db)[0-9]*$/.test(q)?c.id.toLowerCase().startsWith(q):JSON.stringify(c).toLowerCase().includes(q))));if(!visible.some(c=>c.id===selected))selected=visible[0]?.id;renderList();detail()}
function renderList(){$('filtered-count').textContent=`${visible.length}件を表示`;$('list').innerHTML=visible.map(c=>`<button class="item ${selected===c.id?'active':''}" data-id="${esc(c.id)}" aria-current="${selected===c.id}"><span class="id">${esc(c.id)} · ${names[c.decision]}</span><span class="name">${esc(c.title_ja)}</span>${reviewed(reviews[c.id])?'<span class="state">評価済み</span>':''}</button>`).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderList();detail()})}
function detail(){const c=DATA.cards.find(x=>x.id===selected);if(!c){$('detail').innerHTML='<p class="empty">該当する問題がありません。</p>';return}const r=reviews[c.id]||{},f=c.feasibility,idx=visible.findIndex(x=>x.id===c.id);$('detail').innerHTML=`
<div class="navrow"><div class="tags"><span class="tag">${esc(c.id)}</span><span class="tag">${names[c.decision]}</span></div><div><button id="prev" ${idx<=0?'disabled':''}>前へ</button> <button id="next" ${idx>=visible.length-1?'disabled':''}>次へ</button></div></div>
<h2>${esc(c.title_ja)}</h2>
<p><strong>変更：</strong>${esc(c.change_ja)}</p>
${f.solution_status==='source_claim_only'?'<p class="notice">この問は出典にある幾何的命題を用います。具体的な与条件と答えは検算済みですが、その一般命題の証明は今回独立に確認していません。</p>':''}
${c.problem_ja?`<h3>改訂した問題</h3><div class="lead">${esc(c.problem_ja)}</div><p><strong>答え：</strong><span class="equation">${esc(c.answer_exact)}</span></p><div class="solution"><div><h3>使う性質と解法</h3>${listHTML(c.geometry_solution_ja,true)}</div><div class="arithmetic"><h3>着想後に残る計算</h3>${listHTML(c.arithmetic_ja)}</div></div>`:`<p class="notice">今回の主学習候補には含めていません。</p>`}
<div class="section"><h3>幾何を使う実益</h3><p>${esc(c.why_geometry_helps_ja)}</p><h3>学習問題としての注意点</h3><p class="warning">${esc(c.shortcut_risk_ja)}</p>${c.parameter_family_ja?'<h3>数値を変える方針</h3><p>'+esc(c.parameter_family_ja)+'</p>':''}</div>
<details><summary>前版との比較</summary><p><strong>前版の問題点：</strong>${esc(c.diagnosis_ja)}</p><div class="lead">${esc(c.previous.problem_template_ja)}</div><h3>前版の問い</h3>${listHTML((c.previous.numeric_queries||[]).map(q=>q.expression+'：'+q.meaning_ja))}</details>
<details><summary>実在例・答え・関係の検証</summary><p>${esc(f.method_ja)}</p><p class="muted">実在例：${esc(f.status)} ／ 解法の根拠：${proofNames[f.solution_status]||esc(f.solution_status)} ／ 検証スクリプト：${esc(f.script||'—')}</p>${f.witness?'<pre>'+esc(JSON.stringify(f.witness,null,2))+'</pre>':''}<p class="muted">座標は配置の実在確認用です。上の問題文の与条件には含めません。</p></details>
<details><summary>出典・確認事項</summary><div class="source">${c.source.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> — ${esc(s.locator)}`).join('<br>')}</div>${listHTML(c.review_notes_ja)}<p class="muted">前版の構造群：${esc(c.legacy_structural_group)}。これは図形構造の重複を数える区分で、独立した学習効果を保証する数ではありません。</p></details>
<div class="review"><h3>この改訂の評価</h3><div class="reviewgrid"><label>採否<select id="decision">${opts([['','未評価'],['accept','採用'],['revise','修正して採用'],['probe','性質の確認用へ'],['reject','不採用']],r.decision)}</select></label><label>着想後の計算<select id="arithmetic">${opts([['','未評価'],['light','十分に軽い'],['heavy','まだ重い'],['trivial','単純すぎる']],r.arithmetic)}</select></label><label>幾何を使う実益<select id="benefit">${opts([['','未評価'],['clear','明確'],['weak','弱い'],['none','実益がない']],r.benefit)}</select></label><label>定義・与条件・解法<select id="correctness">${opts([['','未評価'],['ok','妥当'],['fix','修正が必要'],['uncertain','追加確認が必要']],r.correctness)}</select></label><label class="wide">コメント<textarea id="comment" placeholder="より自然な与条件、使わせたい関係、数値や問いの改善案など">${esc(r.comment||'')}</textarea></label></div><div id="save-status" role="status">変更するとブラウザに保存します。</div></div>`;
$('prev').onclick=()=>{selected=visible[idx-1].id;renderList();detail()};$('next').onclick=()=>{selected=visible[idx+1].id;renderList();detail()};for(const k of ['decision','arithmetic','benefit','correctness','comment'])$(k).addEventListener(k==='comment'?'input':'change',()=>{reviews[c.id]={...reviews[c.id],id:c.id,[k]:$(k).value,updated_at:new Date().toISOString()};persist();renderList();counts()});}
$('export').onclick=()=>{const content={version:2,dataset_sha256:DATA.sha256,exported_at:new Date().toISOString(),reviews:Object.values(reviews).filter(reviewed)};const url=URL.createObjectURL(new Blob([JSON.stringify(content,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='humpty-v2-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('import').onchange=async()=>{const file=$('import').files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.version!==2||!Array.isArray(d.reviews))throw Error('v2の評価ファイルを指定してください');if(d.dataset_sha256!==DATA.sha256)throw Error('問題データの版が異なります。誤適用を避けるため読み込みません');for(const r of d.reviews){if(DATA.cards.some(c=>c.id===r.id))reviews[r.id]=r}persist();counts();filter();$('global-status').textContent='評価を読み込みました。'}catch(e){$('global-status').textContent='読み込めませんでした：'+e.message}};
for(const k of ['search','split','reviewed'])$(k).addEventListener(k==='search'?'input':'change',filter);counts();filter();
</script></html>
