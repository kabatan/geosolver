<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740"><rect width="1240" height="740" fill="white" /><text x="38" y="43" font-family="DejaVu Sans" font-size="25" fill="#163047" font-weight="bold">Content audit: counted coincidences and solution relations differ</text><text x="38" y="83" font-family="DejaVu Sans" font-size="16" fill="#163047" font-weight="normal">Saved numerical figures. No claim about minimum proof depth.</text><text x="38" y="126" font-family="DejaVu Sans" font-size="22" fill="#163047" font-weight="bold">AIME 2012 I-12</text><text x="38" y="155" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">0 retained coincidence candidates</text><polyline points="383.0793,519.8756 207.2095,240.6448 207.2095,519.8756 383.0793,519.8756" fill="none" stroke="#163047" stroke-width="2.5" stroke-linejoin="round" /><polyline points="207.2095,519.8756 336.1807,445.4140" fill="none" stroke="#167caf" stroke-width="2.5" stroke-linejoin="round" /><polyline points="207.2095,519.8756 291.3211,374.1900" fill="none" stroke="#167caf" stroke-width="2.5" stroke-linejoin="round" /><circle cx="383.07925964250893" cy="519.875585284281" r="3.5" fill="#163047" /><text x="395.07925964250893" y="526.875585284281" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">A</text><circle cx="207.20948533551524" cy="240.64481605351173" r="3.5" fill="#163047" /><text x="185.20948533551524" y="232.64481605351173" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">B</text><circle cx="207.20948533551524" cy="519.875585284281" r="3.5" fill="#163047" /><text x="185.20948533551524" y="536.875585284281" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">C</text><circle cx="336.18065316064394" cy="445.4140468227425" r="3.5" fill="#163047" /><text x="349.18065316064394" y="454.4140468227425" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">D</text><circle cx="291.3211165258166" cy="374.18996655518396" r="3.5" fill="#163047" /><text x="303.3211165258166" y="378.18996655518396" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">E</text><text x="38" y="649" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">Official solution uses a ratio equality:</text><text x="38" y="679" font-family="DejaVu Sans" font-size="21" fill="#167caf" font-weight="bold">CD / BC = DE / BE = 8 / 15</text><text x="38" y="710" font-family="DejaVu Sans" font-size="15" fill="#163047" font-weight="normal">This relation is outside the five registered predicate types.</text><text x="634" y="126" font-family="DejaVu Sans" font-size="22" fill="#163047" font-weight="bold">HMMT 2019 Geometry 10</text><text x="634" y="155" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">630 / 679 similar pairs come from given squares</text><polyline points="884.4832,399.7269 913.8377,399.7269 913.8377,429.0814 884.4832,429.0814 884.4832,399.7269" fill="none" stroke="#9aa6ad" stroke-width="1.4" stroke-linejoin="round" /><polyline points="913.8377,399.7269 901.6791,370.5461 930.8598,358.3875 943.0185,387.5683 913.8377,399.7269" fill="none" stroke="#9aa6ad" stroke-width="1.4" stroke-linejoin="round" /><polyline points="901.6791,370.5461 884.4832,399.7269 855.3025,382.5311 872.4983,353.3503 901.6791,370.5461" fill="none" stroke="#9aa6ad" stroke-width="1.4" stroke-linejoin="round" /><polyline points="855.3025,382.5311 884.4832,429.0814 837.9329,458.2622 808.7522,411.7119 855.3025,382.5311" fill="none" stroke="#9aa6ad" stroke-width="1.4" stroke-linejoin="round" /><polyline points="913.8377,429.0814 943.0185,387.5683 984.5316,416.7490 955.3508,458.2622 913.8377,429.0814" fill="none" stroke="#9aa6ad" stroke-width="1.4" stroke-linejoin="round" /><polyline points="930.8598,358.3875 872.4983,353.3503 877.5354,294.9888 935.8970,300.0259 930.8598,358.3875" fill="none" stroke="#9aa6ad" stroke