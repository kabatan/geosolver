e cx="913.8377112305565" cy="429.0814020109858" r="3.5" fill="#163047" /><text x="881.8377112305565" y="447.0814020109858" font-family="DejaVu Sans" font-size="16" fill="#163047" font-weight="normal">B1</text><circle cx="943.0184913987592" cy="387.5682683193164" r="3.5" fill="#163047" /><text x="927.0184913987592" y="377.5682683193164" font-family="DejaVu Sans" font-size="16" fill="#163047" font-weight="normal">B2</text><circle cx="913.8377112305565" cy="399.7269267227343" r="3.5" fill="#163047" /><text x="889.8377112305565" y="391.7269267227343" font-family="DejaVu Sans" font-size="16" fill="#163047" font-weight="normal">B</text><text x="634" y="649" font-family="DejaVu Sans" font-size="18" fill="#163047" font-weight="normal">Official S2 uses B7, absent from the DSL.</text><text x="634" y="679" font-family="DejaVu Sans" font-size="18" fill="#167caf" font-weight="normal">Blue and orange triangles have scale ratio 1:5.</text><text x="634" y="710" font-family="DejaVu Sans" font-size="15" fill="#163047" font-weight="normal">B7 was supplied by the official solution, not discovered.</text></svg>